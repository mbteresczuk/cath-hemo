services:
  - type: web
    name: cath-hemo
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
    autoDeploy: true
    disk:
      name: coords-disk
      mountPath: /mnt/render-coords
      sizeGB: 1
